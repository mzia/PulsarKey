name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam-u2f pamu2fcfg yubikey-manager appstream

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Check
        run: cargo check --verbose

      - name: Cargo Build (Release)
        run: cargo build --release --verbose

      - name: Validate AppStream Metadata
        run: |
          appstreamcli validate packaging/flatpak/io.github.mzia.PulsarKey.metainfo.xml || true
