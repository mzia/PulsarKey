<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Cosmic Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="50%" stop-color="#0e131a" />
      <stop offset="100%" stop-color="#080b10" />
    </linearGradient>

    <!-- Fingerprint Glowing Neon Gradient -->
    <linearGradient id="fingerprintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="30%" stop-color="#00bbf9" />
      <stop offset="70%" stop-color="#48cae4" />
      <stop offset="100%" stop-color="#00e5a3" />
    </linearGradient>

    <!-- Subtle Scan Line Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00bbf9" stop-opacity="0" />
    </linearGradient>

    <!-- Reticle Radial Gradient -->
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#00bbf9" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow for Squircle -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base for COSMIC / Pop!_OS Desktop -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#222c3a" stroke-width="4" filter="url(#squircleShadow)" />

  <!-- Biometric Scanner Reticle / Target Elements -->
  <circle cx="256" cy="256" r="210" fill="url(#radarGlow)" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#253346" stroke-width="2" stroke-dasharray="12 16" opacity="0.6" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1d2838" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />

  <!-- Scanner Corner Brackets -->
  <path d="M 120 160 L 120 120 L 160 120" fill="none" stroke="#00bbf9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
  <path d="M 352 120 L 392 120 L 392 160" fill="none" stroke="#00bbf9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
  <path d="M 120 352 L 120 392 L 160 392" fill="none" stroke="#00bbf9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
  <path d="M 352 392 L 392 392 L 392 352" fill="none" stroke="#00bbf9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />

  <!-- Horizontal Biometric Laser Scan Band -->
  <rect x="70" y="210" width="372" height="92" fill="url(#scanGrad)" />
  <line x1="80" y1="256" x2="432" y2="256" stroke="#00f5d4" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />

  <!-- ======================================================== -->
  <!-- MAIN BIOMETRIC FINGERPRINT GRAPHIC                       -->
  <!-- ======================================================== -->
  <g filter="url(#neonGlow)" stroke="url(#fingerprintGrad)" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Ridge 1: Outermost Top Arch & Side Traces -->
    <path d="M 160 350
             C 148 300, 148 220, 185 168
             C 215 125, 297 125, 327 168
             C 364 220, 364 300, 352 350" />

    <!-- Ridge 2: Outer Upper Crest and Right Tail -->
    <path d="M 182 380
             C 172 320, 172 235, 204 192
             C 228 160, 284 160, 308 192
             C 336 230, 340 300, 335 372" />

    <!-- Ridge 3: Left Flank Ridge -->
    <path d="M 152 270
             C 152 245, 160 215, 175 190" />
    <path d="M 142 320
             C 138 290, 138 250, 148 215" />

    <!-- Ridge 4: Mid Arch Loop -->
    <path d="M 204 395
             C 198 340, 196 250, 222 220
             C 238 200, 274 200, 290 220
             C 310 245, 314 315, 310 395" />

    <!-- Ridge 5: Inner Whorl Loop -->
    <path d="M 226 405
             C 220 360, 220 270, 240 248
             C 248 238, 264 238, 272 248
             C 288 268, 290 340, 286 405" />

    <!-- Ridge 6: Center Core Loop (Pulsar Biometric Core) -->
    <path d="M 246 410
             C 244 380, 242 290, 252 276
             C 256 270, 260 270, 262 276
             C 268 290, 268 375, 266 410" />

    <!-- Ridge 7: Central Core Apex -->
    <path d="M 256 310
             L 256 370" />

    <!-- Ridge 8: Right Flank Extensions -->
    <path d="M 360 270
             C 360 245, 352 215, 337 190" />
    <path d="M 370 320
             C 374 290, 374 250, 364 215" />
    <path d="M 335 390
             C 342 360, 345 330, 342 300" />

    <!-- Ridge 9: Lower Delta / Lateral Ridges -->
    <path d="M 170 410
             C 165 375, 168 340, 168 310" />
    <path d="M 345 410
             C 350 375, 348 340, 348 310" />
  </g>

  <!-- Pulsar Center Star / Biometric Authenticated Beacon -->
  <circle cx="256" cy="315" r="5" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="256" cy="315" r="2.5" fill="#00f5d4" />

  <!-- Bottom Accent / COSMIC Celestial Dot Indicator -->
  <circle cx="256" cy="454" r="5" fill="#00f5d4" opacity="0.8" />
  <circle cx="236" cy="454" r="3" fill="#00bbf9" opacity="0.5" />
  <circle cx="276" cy="454" r="3" fill="#00bbf9" opacity="0.5" />
</svg>
