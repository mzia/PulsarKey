app-id: io.github.mzia.CosmicFido2
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cosmic-fido2

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=session-bus
  - --device=all
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.system76.CosmicStatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --system-talk-name=org.freedesktop.login1
  - --talk-name=org.freedesktop.Flatpak

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/cosmic-fido2/cargo

modules:
  - name: cosmic-fido2
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --verbose || cargo build --release --verbose
      - install -Dm755 target/release/cosmic-fido2 /app/bin/cosmic-fido2
      - install -Dm644 packaging/flatpak/io.github.mzia.CosmicFido2.desktop /app/share/applications/io.github.mzia.CosmicFido2.desktop
      - install -Dm644 packaging/flatpak/io.github.mzia.CosmicFido2.metainfo.xml /app/share/metainfo/io.github.mzia.CosmicFido2.metainfo.xml
      - install -Dm644 packaging/flatpak/io.github.mzia.CosmicFido2.svg /app/share/icons/hicolor/scalable/apps/io.github.mzia.CosmicFido2.svg
    sources:
      - type: dir
        path: ../..
